services:
  backend:
    user: "${HOST_UID}:${HOST_GID}"
    env_file:
      - .env
      - .env.local
    volumes:
      - .:/app
    command:
      - python
      - -m
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

  frontend:
    # The final stage only serves the built files; the dev server needs Node.
    build:
      target: build
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0

  nginx:
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/restarting.html:/usr/share/nginx/html/restarting.html:ro
      - ./nginx/restarting.gif:/usr/share/nginx/html/restarting.gif:ro

  # The dev Discord bot: a second Discord application, so it never logs in
  # with production's token (two processes on one token both answer every
  # command). Its commands only exist in your test server, and it keeps its
  # own /link table. Start it with --profile bot (see the README).
  bot:
    environment:
      DISCORD_TOKEN: ${DEV_DISCORD_TOKEN:-}
      BOT_DEV_GUILD_ID: ${DEV_BOT_GUILD_ID:-}
    volumes:
      - ./bot/data-dev:/app/bot/data
    # Without DEV_DISCORD_TOKEN it can't log in; don't retry forever.
    restart: "no"
