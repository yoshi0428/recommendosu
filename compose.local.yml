services:
  backend:
    env_file:
      - .env
      - .env.local
    volumes:
      - .:/app
    command:
      - python
      - -m
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

  frontend:
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0

  nginx:
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro