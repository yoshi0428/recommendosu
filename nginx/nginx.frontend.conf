server {
    listen 4173;
    root /usr/share/nginx/html;

    # React Router handles every other path in the browser, so unknown paths
    # get index.html (what `serve -s` did).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the page itself, so a new deploy is picked up at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite puts a content hash in every file name under /assets/, so a changed
    # file gets a new URL and the old one can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
