name: Release to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build sdist & wheel
        run: |
          pip install --upgrade pip build
          python -m build

      - name: Sanity-check the wheel
        run: |
          pip install dist/*.whl
          python -c "import parsecore; from parsecore.Performance import Difficulty; print('wheel ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/project/parsecore/
    permissions:
      # Trusted publishing (OIDC) — no API token needed once the
      # GitHub repo is registered as a trusted publisher on PyPI.
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
