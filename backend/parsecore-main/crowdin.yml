project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

preserve_hierarchy: true

files:
  - source: /docs/_build/gettext/**/*.pot
    # The API reference is auto-generated from docstrings (~570 strings) and is
    # left in English; only the human-written guides/quickstart are translated.
    ignore:
      - /docs/_build/gettext/api/**
    translation: /docs/locales/%two_letters_code%/LC_MESSAGES/**/%file_name%.po
