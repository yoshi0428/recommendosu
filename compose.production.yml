services:
  backend:
    env_file:
      - .env
      - .env.production
    environment:
      # Also written to ./logs. Production only: the local stack shares this
      # checkout, so it would hit the same root-owned file, and two processes
      # can't safely rotate one log file.
      LOG_FILE: /app/logs/backend.log
    volumes:
      - ./beatmap_recommender:/app/beatmap_recommender
      - ./logs:/app/logs

  frontend:
    volumes:
      - ./nginx/nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/restarting.html:/usr/share/nginx/html/restarting.html:ro
      - ./nginx/restarting.gif:/usr/share/nginx/html/restarting.gif:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro