<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // iOS zooms in when focusing an input with text under 16px. maximum-scale
      // stops that, and iOS still allows pinch-zoom. Android would block
      // pinch-zoom entirely, so this is only applied on iOS (iPadOS reports
      // itself as a Mac, hence the touch check).
      //
      // The "ios" class lets CSS hide controls iOS ignores, such as the
      // audio preview volume (pages can't set volume there).
      if (
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
      ) {
        document.documentElement.classList.add("ios");
        document
          .querySelector('meta[name="viewport"]')
          .setAttribute(
            "content",
            "width=device-width, initial-scale=1.0, maximum-scale=1"
          );
      }
    </script>
    <title>recommendosu</title>

    <meta
      name="description"
      content="A recommender for ranked and loved osu!std beatmaps!"
    />

    <meta property="og:site_name" content="recommendosu" />
    <meta property="og:title" content="recommendosu" />
    <meta
      property="og:description"
      content="A recommender for ranked and loved osu!std beatmaps!"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://recommendosu.com" />

    <meta
      property="og:image"
      content="https://recommendosu.com/favicon/web-app-manifest-512x512.png"
    />

    <link
      rel="icon"
      type="image/png"
      href="/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="/favicon/site.webmanifest" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
