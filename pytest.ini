# pytest configuration.
#
# Run the fast suite (what you'll use 99% of the time):
#     python -m pytest
#
# Also run the slow test against the real 583MB dummy.db:
#     python -m pytest -m slow
#
# Useful flags:
#     -v            show every test name instead of dots
#     -x            stop at the first failure
#     -k canonical  only run tests whose name contains "canonical"
#     -s            show print() output
#     --log-cli-level=INFO  show the recommender's log messages

[pytest]
testpaths = tests

# Put the project root on sys.path so tests can `import main` and
# `import beatmap_recommender...` exactly like the app does.
pythonpath = .

# Custom markers have to be registered, otherwise pytest warns about typos.
markers =
    slow: needs the real beatmap_recommender/dummy.db and takes several seconds

# Skip slow tests unless they are explicitly selected with `-m slow`.
addopts = -m "not slow"

# Starlette warns about its own httpx dependency. It's not our code and
# not actionable here, so hide it to keep the output readable.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
