# pytest configuration.
#
# Run the fast tests (what you will use 99% of the time):
#     python -m pytest
#
# Run the slow tests on the real 583MB dummy.db:
#     python -m pytest -m slow
#
# Useful flags:
#     -v            show each test name, not dots
#     -x            stop at the first failure
#     -k canonical  run only the tests with "canonical" in their name
#     -s            show print() output
#     --log-cli-level=INFO  show the log messages of the recommender

[pytest]
testpaths = tests

# Put the project root on sys.path, so that the tests can `import main` and
# `import beatmap_recommender...` exactly as the app does.
pythonpath = .

# Custom markers must be registered. If not, pytest warns about typos.
markers =
    slow: needs the real beatmap_recommender/dummy.db and takes several seconds

# Skip the slow tests, unless you select them with `-m slow`.
addopts = -m "not slow"

# Starlette warns about its own httpx dependency. It is not our code, and we
# cannot fix it here. Thus hide the warning, so that the output stays readable.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
